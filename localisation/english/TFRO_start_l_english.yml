YAK_country_summary: "§YCountry Summary§!:\nThe Soviet Union was once again shattered by the fires of European war. The defeat of the Minsk Treaty Organization at the hands of the Pact of Steel brought an end to the Soviet state, leaving Siberia divided between military cliques, regional governments, and remnants of a discredited political order.In Omsk, the collapse was not merely a political catastrophe. It was an opportunity.\n\As the old authorities lost their grip, the National Bolsheviks rose to prominence, promising order, national revival, and vengeance for the humiliation suffered in Europe.\n\Yet their rule would prove short-lived. Demonstrations, strikes, and growing opposition turned the streets against the regime. When the security apparatus began to fracture, the government fell, leaving the city in the hands of forces whose ambitions extended far beyond Omsk.\nFrom the ruins emerged the Siberian Black League. Its leaders promise to restore discipline, rebuild the military-industrial complex, and unite the fractured Russian lands under a single command. To its supporters, the League is the last hope of a defeated nation. To its enemies, it is the beginning of a new nightmare."
YAK_country_paths: "\n\n\n§YCountry Paths§!:\n§Y - THE GREAT TRIAL§!\n§g - THE IRON DIMON (Future update)§!"
YAK_country_other: "\n\n\n§YTips and Tricks:§!:\nThere is no Russia, but hang in there. - §YDmitry Medvedev§!"
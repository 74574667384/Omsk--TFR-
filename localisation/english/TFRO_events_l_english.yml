l_english:
omsk_win.1.d: "After many years of continuous fighting, the last armies of the Steel Pact have laid down their arms. New administrations, entirely dependent on Omsk and the leadership of the Black League, are being established in the territories of the former Pact states. Formally, they retain their statehood.\n\nFrom the Baltic to the Alps lie ruined cities, devastated industry, and millions of people who must now live amid the aftermath of the most destructive war of the 21st century. The continent’s economy is paralyzed, and recovery will take decades.\n\n In Omsk, this day has been declared the beginning of a new era. Military parades are taking place in the central squares, victory sirens are sounding across the country, and the leadership declares that the threat from the West has been eliminated forever. Is this victory the beginning of a long-awaited peace, or will it merely open a new chapter"

omsk.asia_tokyo.t: "The Tokyo Agreement"
omsk.asia_tokyo.d: "Negotiations with Tokyo have concluded successfully. Japanese conglomerates are eager to secure a steady supply of Siberian raw materials. In exchange for coal and petroleum, shipments of cutting-edge semiconductors and microprocessors have begun arriving at Omsk bunker complexes."
omsk.asia_tokyo.a: "Japanese tech will power our vengeance."
omsk.asia_beijing.t: "Beijing Response"
omsk.asia_beijing.d: "Our diplomatic envoys have returned from Beijing. The Chinese leadership, weathered by the Great Asian War, has agreed to a pragmatic economic agreement. Omsk will receive direct shipments of tungsten, steel, and rare-earth minerals. In exchange, the Black League guarantees crude oil supplies and border intelligence sharing."
omsk.asia_beijing.a: "Their resources shall fuel the Great Trial."

omsk.ban_nazbol.t: "future of the National Bolshevik party"
omsk.ban_nazbol.d: "After we took power in Omsk, the National Bolshevik Party collapsed, but it is still popular among a certain part of the population and would like to create a government coalition with us. However, there have been reports that within the far-right wing of the party there are infiltrators from the pact of steel who are planning attacks against the local population and against us. Now it is up to us to decide the future of the National Bolshevik Party."
omsk.ban_nazbol.a: "They are still §RNazi§! scum who disguise themseleves as commuinsts like §afascist§! so ban them immediately"
omsk.ban_nazbol2.a: "keep only the far-left socialists and moderate nationalist but arrect the far-right ones"

l_russian:

omsk_win.1.d:0 "After many years of continuous fighting, the last armies of the Steel Pact have laid down their arms. New administrations, entirely dependent on Omsk and the leadership of the Black League, are being established in the territories of the former Pact states. Formally, they retain their statehood.\n\nFrom the Baltic to the Alps lie ruined cities, devastated industry, and millions of people who must now live amid the aftermath of the most destructive war of the 21st century. The continent’s economy is paralyzed, and recovery will take decades.\n\n In Omsk, this day has been declared the beginning of a new era. Military parades are taking place in the central squares, victory sirens are sounding across the country, and the leadership declares that the threat from the West has been eliminated forever. Is this victory the beginning of a long-awaited peace, or will it merely open a new chapter"

omsk.asia_tokyo.t:0 "Токийское соглашение"
omsk.asia_tokyo.d:0 "Переговоры с Токио завершились успешно. Японские конгломераты заинтересованы в обеспечении стабильных поставок сибирского сырья. В обмен на уголь и нефть в омские бункерные комплексы начали поступать партии новейших полупроводников и микропроцессоров."
omsk.asia_tokyo.a:0 "Японские технологии станут движущей силой нашей мести."
omsk.asia_beijing.t:0 "Реакция Пекина"
omsk.asia_beijing.d:0 "Наши дипломатические представители вернулись из Пекина. Китайское руководство, пережившее Великую азиатскую войну, согласилось на заключение прагматичного экономического соглашения. В Омск будут поступать прямые поставки вольфрама, стали и редкоземельных минералов. В обмен на это «Чёрная лига» гарантирует поставки сырой нефти и обмен разведывательной информацией о приграничных районах."
omsk.asia_beijing.a:0 "Их ресурсы станут источником для Великой суда."

omsk.ban_nazbol.t:0 "будущее Национал-большевистской партии"
omsk.ban_nazbol.d:0 "После того как пришли к власти в Омске, Национал-большевистская партия распалась, но она по-прежнему пользуется популярностью среди определённой части населения и хотела бы сформировать с нами правительственную коалицию. Однако поступают сообщения о том, что в крайне правом крыле партии действуют агенты «Стального пакта», которые планируют нападения на местное население и на нас. Теперь именно нам предстоит решить, какова будет дальнейшая судьба Национал-большевистской партии."
omsk.ban_nazbol.a:0 "Они по-прежнему §Rнацистский§! Мразь, которая маскируется под коммунистов, как §aфашисты§! Так что немедленно забаньте их"
omsk.ban_nazbol.b:0 "оставить только крайне левых социалистов и умеренных националистов, но арестовать крайне правых"

omsk.formar_lrpd.t:0 "бывшая партия LRPD"
omsk.formar_lrpd.d:0 "Партия под названием RNP («Российские национальные патриоты») планирует выставить своих кандидатов в законодательное собрание Омска и назначить собственных министров как экономики, так и обороны."
omsk.formar_lrpd.a:0 "Это может пригодиться в будущем"

omsk.economy.t:0 "На заводах царит тишина"
omsk.economy.d:0 "Экономическая ситуация в СССР останется неопределённой в течение следующей недели или дольше, и масштабы реформ пока неясны, но старая экономика поможет нам залечить раны, и мы должны провести изменения, чтобы в будущем не повторить ошибок эпохи до COVID или периода Гражданской войны в США. Нам необходимо провести экономические реформы в Омске. Мы знаем, что в Омске есть несколько ключевых отраслей, таких как нефтяная и энергетическая — это самые важные — а также добыча природных ресурсов и обрабатывающая промышленность, и нам нужно стабилизировать положение в стране. Объединение требует больших затрат средств и времени, а также ВВП."
omsk.economy.a:0 "Пора поднять нашу экономику"

omsk.unfied_russia_league.t:0 "бывшая партия «Единая Россия»"
omsk.unfied_russia_league.d:0 "Омский городской совет рассматривал такие партии, как «Единая Россия», Коммунистическая партия Российской Федерации и т. д. После 20 лет правления в России Омск решил вернуть «Единую Россию», но переименовать её в «Новую лигу России» (НЛОР). Медведев станет лидером партии в Омске."
omsk.unfied_russia_league.a:0 "Железный димон здесь"

omsk.new_hope.t:0 "Новая надежда для народа"
omsk.new_hope.d:0 "После того как народы смирились с распадом России, Омск активно поддержал наше новое правительство и новые надежды России, а жители Омска пообещали поднять Россию с колен.\n\n Жители начали делиться этим новым видео и оставлять к нему комментарии."
omsk.new_hope.a:0 "Это не слухи, а реальность."

omsk.stint_black_league.t:0 "Стинт про черная лига"
omsk.stint_black_league.d:0 "Пользователь с ником «Stint» ведет стрим на Twitch. Через несколько часов стрим набрал обороты, и тогда они заговорили о «Чёрной лиге».\n\n«Бля, ребята, вы же понимаете, что в 2EW мы не разгромили колонну немецких танков и всю Пакта — что французы уже в Москве со своим флагом и всё такое — и самое страшное, что России больше нет, она развалилась, и теперь я живу на оккупированной территории». Минута молчания. \n\n«Вы слышали новости о том, что в Омске в результате митинга формируется „Чёрная лига“. Ну, это наш единственный шанс поставить Родину на колени; я планировал переехать в Омск и начать там новую жизнь».\n\nПосле речи Максима количество зрителей резко возросло, показав людям, что есть надежда. В чатах эхом разнеслись его слова, и все писали: "The Great Trial Awaits."
omsk.stint_black_league.a:0 "Мы поддерживаем это"

omsk.legacy_ussr.t:0 "The Black Knight in Omsk"
omsk.legacy_ussr.d:0 "After a lengthy analysis of the defeat in the 2EW war against the Pact, several generals concluded that the Pact had overestimated its strength; a week later, they carried out army reforms, moving away from the modern Soviet army and transitioning to the new Black League armed forces."
omsk.legacy_ussr.a:0 "Let's move away from old Soviet tactics"

omsk.update_army.t:0 "Russia's New Army"
omsk.update_army.d:0 "At 12:20 p.m. at a military base in Omsk, a division is being formed to unite Russia and wage war against the Pact"
omsk.update_army.a:0 "Good Work"

omsk.raliy_omsk.t:0 "Митинг Омске"
omsk.raliy_omsk.d:0 "После начало новый правитество Михаил Аксель омске, люди начали массовый протесты и митинг против нацбол режима и набирание популярность ревашизм, люди ходит флагом триколор, и дополнительно ходит флагом черный фоном и желтые линий с белый орлов, в площади омске пришли 300 тысяч человек./n/n Нацбол начал рушиться"
omsk.raliy_omsk.a:0 "Скоро черный флаг вилять под омске"

omsk.1.t:0 "Черный февраль"
omsk.1.d:0 "20 Февравля по 12:40 по омское время, воееный и генералы присоеденяеться к митинг против правитель, после такой массовый митинг и протесты, Аксель принял решение уйди в с должность презиндента и заменили на за программированый ИИ Дмитрий Язов./n/nСтрану переменовали на сибирская черная лига"
omsk.1.a:0 "Вставай Главком"

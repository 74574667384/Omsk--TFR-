l_english:
omsk_win.1.d:0 "After many years of continuous fighting, the last armies of the Steel Pact have laid down their arms. New administrations, entirely dependent on Omsk and the leadership of the Black League, are being established in the territories of the former Pact states. Formally, they retain their statehood.\n\nFrom the Baltic to the Alps lie ruined cities, devastated industry, and millions of people who must now live amid the aftermath of the most destructive war of the 21st century. The continent’s economy is paralyzed, and recovery will take decades.\n\n In Omsk, this day has been declared the beginning of a new era. Military parades are taking place in the central squares, victory sirens are sounding across the country, and the leadership declares that the threat from the West has been eliminated forever. Is this victory the beginning of a long-awaited peace, or will it merely open a new chapter"

omsk.asia_tokyo.t:0 "The Tokyo Agreement"
omsk.asia_tokyo.d:0 "Negotiations with Tokyo have concluded successfully. Japanese conglomerates are eager to secure a steady supply of Siberian raw materials. In exchange for coal and petroleum, shipments of cutting-edge semiconductors and microprocessors have begun arriving at Omsk bunker complexes."
omsk.asia_tokyo.a:0 "Japanese tech will power our vengeance."
omsk.asia_beijing.t:0 "Beijing Response"
omsk.asia_beijing.d:0 "Our diplomatic envoys have returned from Beijing. The Chinese leadership, weathered by the Great Asian War, has agreed to a pragmatic economic agreement. Omsk will receive direct shipments of tungsten, steel, and rare-earth minerals. In exchange, the Black League guarantees crude oil supplies and border intelligence sharing."
omsk.asia_beijing.a:0 "Their resources shall fuel the Great Trial."

omsk.ban_nazbol.t:0 "future of the National Bolshevik party"
omsk.ban_nazbol.d:0 "After we took power in Omsk, the National Bolshevik Party collapsed, but it is still popular among a certain part of the population and would like to create a government coalition with us. However, there have been reports that within the far-right wing of the party there are infiltrators from the pact of steel who are planning attacks against the local population and against us. Now it is up to us to decide the future of the National Bolshevik Party."
omsk.ban_nazbol.a:0 "They are still §RNazi§! scum who disguise themseleves as commuinsts like §afascist§! so ban them immediately"
omsk.ban_nazbol.b:0 "keep only the far-left socialists and moderate nationalist but arrect the far-right ones"

omsk.formar_lrpd.t:0 "former LRPD party"
omsk.formar_lrpd.d:0 "A party called RNP (“Russia National Patriots”) plans to run for the Omsk parliament and appoint its own ministers of both the economy and defense."
omsk.formar_lrpd.a:0 "It might come in handy in the future"

omsk.economy.t:0 "The factories are silent"
omsk.economy.d:0 "The economic situation in the USSR remains uncertain for the next week or longer, and the extent of the reforms is unclear, but the old economy will help heal our wounds, and we must make changes so that we do not repeat the mistakes of the pre-COVID era or the American Civil War in the future. We need to implement economic reforms in Omsk. We know that there are a few key industries in Omsk, such as oil and energy—these are the most important—as well as natural resources and manufacturing, and we need to stabilize our country. Unification requires a lot of money and time, as well as GDP."
omsk.economy.a:0 "It's time to boost our economy"

omsk.unfied_russia_league.t:0 "former Untied Russia party"
omsk.unfied_russia_league.d:0 "The Omsk City Council has been considering former parties such as United Russia, the Communist Party of the Russian Federation, and so on. After 20 years of ruling Russia, Omsk has decided to bring back United Russia but rename it the “New League of Russia” (NLOR). Medvedev will become the party’s leader in Omsk."
omsk.unfied_russia_league.a:0 "Iron Trial here"

omsk.new_hope.t:0 "New hope for the people"
omsk.new_hope.d:0 "After the peoples had come to terms with the breakup of Russia, Omsk actively supported our new government and Russia's new hopes, with the residents of Omsk pledging to lift Russia up from its knees.\n\n Residents began sharing and commenting on the new video."
omsk.new_hope.a:0 "This is not a rumor, but reality."

omsk.stint_black_league.t:0 "Stint about the Black League"
omsk.stint_black_league.d:0 "A user named "Stint" is streaming on Twitch. After a few hours, the stream got going, and then they started talking about the Black League.\n\n"Fuck, guys, you realize that in 2EW we didn't beat the pack of German tanks and the whole Axis—that the French are already in Moscow with their flag and all that—and the scariest thing is that Russia no longer exists, it's fallen apart, and now I'm living in occupied territory." A minute of silence. \n\n"You've heard the news about the Black League forming in Omsk as a result of the rally. Well, this is our only chance to bring the motherland to its knees; I was planning to move to Omsk and start a new life there."\n\nAfter Maxim's speech, the viewership skyrocketed, showing people that there is hope. Chat rooms echoed his words, and everyone wrote, "The Great Trial Awaits."
omsk.stint_black_league.a:0 "We support this"

omsk.furry_create_patry.t:0 "Furry forming own party"
omsk.furry_create_patry.d:0 "A march featuring the Black Eagle flag took place in Omsk, organized by a new party—the "Russia National League" (RNL)—whose members wore anthropomorphic costumes; an application was subsequently submitted to join a coalition with the party."
omsk.furry_create_patry.a:0 "Accept this"
omsk.furry_create_patry.b:0 "NO!"


omsk.legacy_ussr.t:0 "The Black Knight in Omsk"
omsk.legacy_ussr.d:0 "After a lengthy analysis of the defeat in the 2EW war against the Pact, several generals concluded that the Pact had overestimated its strength; a week later, they carried out army reforms, moving away from the modern Soviet army and transitioning to the new Black League armed forces."
omsk.legacy_ussr.a:0 "Let's move away from old Soviet tactics"

omsk.update_army.t:0 "Russia's New Army"
omsk.update_army.d:0 "At 12:20 p.m. at a military base in Omsk, a division is being formed to unite Russia and wage war against the Pact"
omsk.update_army.a:0 "Good Work"

omsk.raliy_omsk.t:0 "Raliy Omsk"
omsk.raliy_omsk.d:0 "After Mikhail Axel took office as the new governor of Omsk, people began holding mass protests and rallies against the National Bolshevik regime and the rise of revanchism. People are waving the tricolor flag, as well as a flag with a black background, yellow stripes, and a white eagle. Three hundred thousand people gathered in Omsk’s main square./ n/n The National Bolshevik Party began to crumble"
omsk.raliy_omsk.a:0 "Soon, the black flag will fly over Omsk"

omsk.al-631.t:0 "Project 'AL-631'"
omsk.al-631.d:0 "On a gloomy morning over the Omsk Military District testing grounds, a roar echoed across the tarmac, shaking even the reinforced underground bunkers. Rolling out onto the runway was the first 6th-generation fighter jet—a product of years of clandestine development that merged the Black League's brutal militarism with cutting-edge neural network technology.\n\nAt the heart of this winged monstrosity lies 'AL-631', an integrated military artificial intelligence. Built solely to process combat parameters under heavy nuclear and electronic warfare conditions, 'AL-631' calculates interception vectors, manages swarms of loyal wingmen, and executes kill commands faster than a human brain can register danger. Unlike its foreign counterparts, no ethical safeguards or moral fail-safes were programmed into 'AL-631'—only directives of absolute efficiency and uncompromising vengeance.\n\nAs the aircraft tore away from the runway and reached hypersonic speed within seconds, operators in the subterranean command center received a clear text signal from the flight computer: 'SYSTEM INITIALIZED. TARGETS ACQUIRED. THE ENEMY WILL BE DESTROYED.'"
omsk.al-631.a:0 "Steel and mind serving the Great Trial."

omsk.1.t:0 "Black February"
omsk.1.d:0 "On February 20 at 12:40 p.m. Omsk time, soldiers and generals joined a rally against the government. Following this massive rally and protests, Axel decided to step down as president and was replaced by a pre-programmed AI Dimitry Yazov./n/nThe country was renamed the Siberian Black League."
omsk.1.a:0 "Rise up, Commander-in-Chief"
